name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Preuzmi projekt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Izradi APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preimenuj APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Svatovi-uzivo.apk

      - name: Spremi APK za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: Svatovi-uzivo-APK
          path: Svatovi-uzivo.apk
          if-no-files-found: error
